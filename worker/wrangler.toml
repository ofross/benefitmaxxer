name            = "benefitmaxxer-plaid"
main            = "plaid-proxy.js"
compatibility_date = "2025-01-01"

# Secrets are set via CLI — never commit them:
#   wrangler secret put PLAID_CLIENT_ID
#   wrangler secret put PLAID_SECRET
#   wrangler secret put PLAID_ENV             (sandbox | development | production)
#   wrangler secret put MAILCHANNELS_API_KEY  (from mailchannels.com dashboard)
#
# KV namespace — create once, then paste the IDs here:
#   wrangler kv namespace create USAGE_KV
#   wrangler kv namespace create USAGE_KV --preview
[[kv_namespaces]]
binding    = "USAGE_KV"
id         = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_YOUR_KV_PREVIEW_ID"

[triggers]
# Nightly summary email: 8 AM UTC (midnight Pacific / 4 AM Eastern)
crons = ["0 8 * * *"]
